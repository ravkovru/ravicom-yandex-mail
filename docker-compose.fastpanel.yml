services:
  ravicom-yandex-mail:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      PUBLIC_BASE_URL: https://${DOMAIN}
      DATABASE_URL: sqlite:////data/ravicom-mail.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ravicom-mail-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  ravicom-mail-data:
