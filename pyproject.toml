[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "ravicom-yandex-mail"
version = "0.1.0"
description = "MCP server for Yandex Mail using OAuth/XOAUTH2"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2", "httpx>=0.27,<1", "python-dotenv>=1,<2", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[project.scripts]
ravicom-yandex-mail = "ravicom_mail.server:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
